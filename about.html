<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EZGJYDSTZ5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EZGJYDSTZ5');
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sidebar-w: 220px;
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #aaaaaa;
        }

        body {
            background: var(--bg);
            font-family: "Inter", ui-sans-serif, sans-serif;
            color: var(--text);
            overflow-x: hidden;
        }

        .shell {
            display: flex;
            min-height: 100vh;
        }

        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 80px 80px 80px 56px;
        }

        .about-intro {
            padding-bottom: 72px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 72px;
        }

        .about-intro h1 {
            font-size: clamp(28px, 4vw, 52px);
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: var(--text);
            margin-bottom: 20px;
        }

        .about-intro p {
            font-size: clamp(15px, 1.4vw, 18px);
            font-weight: 300;
            line-height: 1.7;
            color: #666;
            max-width: 640px;
        }

        .about-section {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 0 56px;
            padding-bottom: 72px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 72px;
        }

        .about-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
        }

        .about-meta {
            padding-top: 4px;
        }

        .about-num {
            font-size: 11px;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.12em;
            display: block;
            margin-bottom: 8px;
        }

        .about-heading {
            font-size: clamp(16px, 1.4vw, 20px);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.3;
            color: var(--text);
        }

        .about-content p {
            font-size: clamp(14px, 1.2vw, 17px);
            font-weight: 300;
            line-height: 1.75;
            color: #444;
            margin-bottom: 16px;
        }

        .about-content p:last-of-type { margin-bottom: 0; }

        .about-img-row {
            margin-top: 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .about-img-row img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .site-footer {
            margin-top: 80px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--muted);
            font-family: "JetBrains Mono", monospace;
        }

        @media (max-width: 860px) {
            .about-section { grid-template-columns: 1fr; gap: 16px; }
        }

        @media (max-width: 680px) {
            .main { margin-left: 0; padding: 32px 24px 48px; }
            .about-img-row { grid-template-columns: 1fr; }
        }

        @media (min-width: 1600px) {
            :root { --sidebar-w: 260px; }
            .main { padding: 96px 96px 96px 72px; }
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Lu | About</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap"/>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script src="nav.js"></script>
    <script>initNav('about');</script>
    <script type="text/babel" data-presets="react">
    function App() {
        return (
            <div className="shell">
                <main className="main">

                    <div className="about-intro">
                        <h1>A designer who starts<br/>with people.</h1>
                        <p style={{marginTop:'24px'}}>I research and design experiences that turn complex workflows into something that just feels natural. I care about the details — the moment a user sighs with relief, not frustration.</p>
                    </div>

                    <div className="about-section">
                        <div className="about-meta">
                            <span className="about-num">01</span>
                            <h2 className="about-heading">Design journey</h2>
                        </div>
                        <div className="about-content">
                            <p>I started my design journey working with people living with diabetes at Don Norman's Design Lab at UC San Diego. That experience opened my eyes to how designers can create real impact — not necessarily big gestures, but simply by taking the time to understand people's lives.</p>
                            <div className="about-img-row">
                                <img src="Images/donnorman.png" alt="Don Norman's Design Lab" />
                                <img src="Images/YiLu_Graduation_CornellTech.png" alt="Yi Lu graduation at Cornell Tech" />
                            </div>
                        </div>
                    </div>

                    <div className="about-section">
                        <div className="about-meta">
                            <span className="about-num">02</span>
                            <h2 className="about-heading">I love getting people together</h2>
                        </div>
                        <div className="about-content">
                            <p>I hosted Cornell Tech's Creative Tech Summit and served as student president of MASA at UC San Diego, where I organized events including an Asian Night Market that brought together over 2,500 participants.</p>
                            <p>Building community is something I care about as much as building products.</p>
                            <div className="about-img-row">
                                <img src="Images/MASA_Night Market.png" alt="MASA Night Market" />
                                <img src="Images/creative tech.png" alt="Cornell Tech Creative Tech Summit" />
                            </div>
                        </div>
                    </div>

                    <footer className="site-footer">&copy; 2026 Yi Lu</footer>
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
